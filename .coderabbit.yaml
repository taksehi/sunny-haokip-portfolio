# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
  tools:
    ast-grep:
      enabled: true
    github-checks:
      enabled: true
  path_instructions:
    - path: "src/**"
      instructions: |
        Review frontend React components for modularity, accessibility, clean state transitions, and strict adherence to CSS custom properties / design tokens. Ensure optimal rendering performance for canvas and multimedia elements without blocking the main thread.
    - path: "server/**"
      instructions: |
        Review server/database interactions with Neon Serverless PostgreSQL. Verify parameter binding safety to prevent SQL injection, verify error handling, and ensure sensitive connection secrets are never logged or exposed.
    - path: "api/**"
      instructions: |
        Review Vercel serverless functions for input validation, robust HTTP status responses, and graceful fallback behavior when database access is offline.
chat:
  auto_reply: true
